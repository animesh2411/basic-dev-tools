<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🖼️ AI Image Generator - Basic Dev Tools</title>
    <link rel="stylesheet" href="css/image-generator.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-toBlob@1.0.0/canvas-toBlob.min.js"></script>
</head>
<body>
<header>
    <h1>🖼️ AI Image Generator</h1>
    <a href="../index.html" class="back-link">← Back to Tools</a>
</header>

<main class="tool-container">
    <div class="card">
        <h2>Generate AI Images Instantly</h2>
        <p>Enter a description below and generate an AI image instantly using open-source models.</p>

        <textarea id="promptText" placeholder="Describe what you want to generate..."></textarea>

        <div class="btn-group">
            <button id="generateBtn">Generate Image</button>
            <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div class="canvas-container">
            <canvas id="aiCanvas"></canvas>
        </div>

        <div id="originalText" class="result-box"></div>

        <button id="downloadBtn" disabled>Download Image</button>
    </div>
</main>

<footer>
    Made with ❤️ by Animesh & © 2025 Basic Dev Tools
</footer>

<script src="js/image-generator.js"></script>
</body>
</html>
