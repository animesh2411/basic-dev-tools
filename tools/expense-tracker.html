<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker - Basic Dev Tools</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/expense-tracker.css" />
</head>

<body>
    <header>
        <h1>💰 Expense Tracker</h1>
        <a href="../index.html" class="back-link">← Back to Tools</a>
    </header>

    <main class="tool-container">
        <div class="card">
            <div class="balance-container">
                <div class="balance-box">
                    <h3>Income</h3>
                    <p id="money-plus" class="money plus">₹0.00</p>
                </div>
                <div class="balance-box">
                    <h3>Expense</h3>
                    <p id="money-minus" class="money minus">₹0.00</p>
                </div>
            </div>

            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h3>Your Balance</h3>
                <h1 id="balance">₹0.00</h1>
            </div>

            <h3>Add new transaction</h3>
            <form id="form" class="transaction-form">
                <div class="form-control">
                    <label for="text">Text</label>
                    <input type="text" id="text" placeholder="Enter text..." />
                </div>
                <div class="form-control">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount..." />
                </div>
                <div class="form-control">
                    <label>Type</label>
                    <div class="type-control">
                        <label>
                            <input type="radio" name="transType" value="income" checked> Income
                        </label>
                        <label>
                            <input type="radio" name="transType" value="expense"> Expense
                        </label>
                    </div>
                </div>
                <button class="btn">Add Transaction</button>
            </form>

            <h3>History</h3>
            <ul id="list" class="list">
                <!-- Transactions will appear here -->
            </ul>

            <button id="clearBtn" class="secondary" style="margin-top: 1rem;">Clear All Data</button>
        </div>
    </main>

    <footer>
        <p>Made with ❤️ by <a href="https://github.com/animesh2411" target="_blank"> Animesh</a> | Inspired by GitHub
            style</p>
        <p>© 2025 Basic Dev Tools</p>
    </footer>

    <script src="js/expense-tracker.js"></script>
</body>

</html>
