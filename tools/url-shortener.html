<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>URL Shortener - Basic Dev Tools</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<header>
    <h1>🔗 URL Shortener</h1>
    <a href="../index.html" class="back-link">← Back to Tools</a>
</header>

<main class="tool-container">
    <div class="card">
        <input type="text" id="longUrl" placeholder="Enter long URL here..."/>
        <div class="btn-group">
            <button id="shortenBtn">Shorten URL</button>
            <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div id="shortResult" class="result-box" style="display:none;"></div>
    </div>
</main>

<footer>
    <p>Made with ❤️ by <a href="https://github.com/animesh2411" target="_blank"> Animesh</a> | Inspired by GitHub style
    </p>
    <p>© 2025 Basic Dev Tools</p>
</footer>

<script src="js/url-shortener.js"></script>
</body>
</html>
