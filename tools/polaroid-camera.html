<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Polaroid Camera — Capture & Save</title>

  <!-- styles -->
  <link rel="stylesheet" href="css/polaroid-camera.css">

  <!-- small helper lib for EXIF orientation if you plan to load existing files -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js" defer></script>
  <script src="js/polaroid-camera.js" defer></script>
</head>
<body>
<header>
  <h1>📸 Polaroid Camera</h1>
  <p class="muted">Capture a polaroid-style 4×6 photo and save it to your device.</p>
</header>

<main class="app-shell">
  <section class="camera-card">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="vf-overlay">
        <div class="vf-top"></div>
        <div class="vf-center"></div>
        <div class="vf-bottom">
          <button id="switchBtn" class="control">🔁</button>
          <button id="captureBtn" class="shutter">●</button>
          <button id="saveLastBtn" class="control" title="Save most recent">💾</button>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <label class="small">DPI
        <input id="dpi" type="number" value="300" min="72" max="1200" step="1" />
      </label>

      <label class="small">Fit
        <select id="fit">
          <option value="cover">Cover</option>
          <option value="contain">Contain</option>
        </select>
      </label>

      <label class="small">Sharpen
        <select id="sharpen">
          <option value="mild">Mild</option>
          <option value="none">None</option>
          <option value="strong">Strong</option>
        </select>
      </label>

      <input id="caption" placeholder="Caption (optional)" />
    </div>
  </section>

  <section class="preview-card">
    <div class="preview-header">
      <strong>Most recent capture</strong>
      <span id="infoText" class="small"></span>
    </div>

    <canvas id="canvas" class="preview-canvas"></canvas>

    <div class="preview-actions">
      <a id="downloadLink" class="btn" download="polaroid.jpg">Download</a>
      <button id="shareBtn" class="btn">Share</button>
      <button id="openNewTab" class="btn dark">Open</button>
    </div>
  </section>

  <section class="gallery-card">
    <header><strong>Your captures</strong></header>
    <div id="gallery" class="tile-container"></div>
  </section>
</main>

<footer>
  <small>Works best on mobile. Allow camera access. Images saved via download may appear in Gallery/Photos after the OS indexes the file.</small>
</footer>
</body>
</html>
