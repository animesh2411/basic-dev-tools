<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>⏱️ Cron Expression Reader - Basic Dev Tools</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<header>
    <h1>⏱️ Cron Expression Reader</h1>
    <a href="../index.html" class="back-link">← Back to Tools</a>
</header>

<main class="tool-container">
    <div class="card">
        <input type="text" id="cronExp" placeholder="Enter cron expression (e.g., 0 9 * * 1-5)"/>
        <div class="btn-group">
            <button id="readCronBtn">Read Cron</button>
            <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div id="cronResult" class="result-box" style="display:none;"></div>
    </div>
</main>

<footer>
    <p>Made with ❤️ by <a href="https://github.com/animesh2411" target="_blank"> Animesh</a> | Inspired by GitHub style
    </p>
    <p>© 2025 Basic Dev Tools</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/cronstrue@1.92.0/dist/cronstrue.min.js" defer></script>
<script src="js/cron-read.js"></script>
</body>
</html>
