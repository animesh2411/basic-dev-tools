<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Favicon & Preview Fetcher - Basic Dev Tools</title>
    <!-- reuse your shared style file for consistent look -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <h1>🔎 Favicon & Preview Fetcher</h1>
    <a href="../index.html" class="back-link">← Back to Tools</a>
</header>

<main class="tool-container">
    <div class="card">
        <h2>Enter a URL</h2>
        <input type="text" id="urlInput" placeholder="https://example.com" />

        <div class="btn-group">
            <button id="fetchBtn">Fetch</button>
            <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div id="result" class="result-box" style="display:none;">
            <h3 id="siteTitle">—</h3>
            <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
                <div style="text-align:center;">
                    <p style="margin:0;font-weight:600">Favicon</p>
                    <img id="faviconImg" alt="favicon" style="width:64px;height:64px;border-radius:8px;border:1px solid #e1e4e8;margin-top:8px;" />
                    <div style="margin-top:6px;">
                        <button id="copyFaviconUrl" class="secondary">Copy favicon URL</button>
                    </div>
                </div>

                <div style="flex:1; min-width:200px;">
                    <p style="margin:0;font-weight:600">Preview / Screenshot</p>
                    <img id="previewImg" alt="preview" style="width:100%;max-width:420px;border-radius:8px;border:1px solid #e1e4e8;margin-top:8px;" />
                    <div style="margin-top:6px;">
                        <button id="openPreview" class="secondary">Open preview in new tab</button>
                    </div>
                </div>
            </div>

            <p id="note" style="margin-top:12px;color:#666;font-size:0.95rem;">
                Tip: To get exact OG title/description you may need a server-side fetch (CORS prevents reading arbitrary site HTML from the browser).
            </p>

            <div style="margin-top:10px;">
                <button id="copyPageUrl">Copy page URL</button>
                <a id="visitLink" href="#" target="_blank" style="margin-left:10px;">Open original site</a>
            </div>
        </div>
    </div>
</main>

<footer>
    Made with ❤️ by Animesh & © 2025 Basic Dev Tools
</footer>

<script src="js/favicon-fetcher.js"></script>
</body>
</html>
